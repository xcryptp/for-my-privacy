<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">For My Privacy</title>
  <desc id="d">A padlock and the words For My Privacy: lock the sites you choose behind a password.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a4a"/>
      <stop offset="1" stop-color="#2f3f73"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb4ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- Lock mark -->
  <g transform="translate(150 150)">
    <circle r="92" fill="#ffffff" fill-opacity="0.08"/>
    <path d="M-34 -14 V-38 a34 34 0 0 1 68 0 V-14" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <rect x="-52" y="-18" width="104" height="78" rx="16" fill="url(#mark)"/>
    <circle cx="0" cy="14" r="9" fill="#1e2a4a"/>
    <rect x="-4" y="16" width="8" height="22" rx="4" fill="#1e2a4a"/>
  </g>

  <!-- Wordmark and tagline -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif">
    <text x="290" y="152" font-size="84" font-weight="700" fill="#ffffff" letter-spacing="-1.5">For My Privacy</text>
    <text x="294" y="206" font-size="30" font-weight="400" fill="#c9d6f5">Lock the sites you choose behind a password.</text>
  </g>
</svg>
