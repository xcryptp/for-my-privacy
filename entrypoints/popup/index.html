<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extShortName">For My Privacy</title>
    <link rel="stylesheet" href="../../src/ui/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup">
      <header class="head">
        <svg class="icon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
          <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="currentColor" />
          <path
            d="M8 10.5V8a4 4 0 0 1 8 0v2.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <h1 data-i18n="extShortName"></h1>
      </header>

      <button id="lock" type="button" data-i18n="lockNowButton"></button>
      <p id="status" class="status" role="status"></p>
      <p id="shortcut" class="muted" hidden></p>
      <button id="settings" type="button" class="secondary" data-i18n="popupOpenSettings"></button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
