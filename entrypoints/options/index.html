<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="manifest.open_in_tab" content="true" />
    <title data-i18n="extShortName">For My Privacy</title>
    <link rel="stylesheet" href="../../src/ui/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="page" class="page">
      <header class="head">
        <svg class="icon" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" focusable="false">
          <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="currentColor" />
          <path
            d="M8 10.5V8a4 4 0 0 1 8 0v2.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <h1 id="title"></h1>
        <button id="lock-now" type="button" class="secondary" data-i18n="lockNowButton" hidden></button>
      </header>

      <!-- First run, no password yet: four onboarding steps (step 3 and 4 run after the worker granted the settings) -->
      <section id="view-setup" class="card" hidden>
        <div class="progress">
          <p class="progress-text">
            <span id="ob-progress" aria-hidden="true"></span>
            <span id="ob-progress-sr" class="visually-hidden"></span>
          </p>
          <div class="progress-bar" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </div>
        </div>

        <div id="step-1" class="step" hidden>
          <h2 id="step-1-title" tabindex="-1" aria-describedby="ob-progress-sr" data-i18n="onboardingWelcomeTitle"></h2>
          <ul class="points">
            <li data-i18n="onboardingWelcomeLine1"></li>
            <li data-i18n="onboardingWelcomeLine2"></li>
            <li>
              <span data-i18n="onboardingWelcomeLine3"></span>
              <a id="learn-more" target="_blank" rel="noopener noreferrer" data-i18n="onboardingLearnMore"></a>
            </li>
          </ul>
          <div class="actions">
            <button id="ob-start" type="button" data-i18n="onboardingStart"></button>
          </div>
        </div>

        <div id="step-2" class="step" hidden>
          <h2 id="step-2-title" tabindex="-1" aria-describedby="ob-progress-sr" data-i18n="setupTitle"></h2>
          <form id="setup-form" class="form" autocomplete="off">
            <p id="setup-hint" class="muted" data-i18n="setupHint"></p>
            <div id="setup-warning" class="warning" role="note">
              <strong data-i18n="setupWarningTitle"></strong>
              <span data-i18n="setupWarningBody"></span>
            </div>
            <label for="setup-password" class="spaced" data-i18n="passwordLabel"></label>
            <input id="setup-password" type="password" autocomplete="new-password" required />
            <label for="setup-confirm" class="spaced" data-i18n="confirmPasswordLabel"></label>
            <input id="setup-confirm" type="password" autocomplete="new-password" required />
            <p id="setup-error" class="message error" role="alert"></p>
            <div class="actions">
              <button id="back-2" type="button" class="secondary" data-i18n="backButton"></button>
              <button id="setup-submit" type="submit" data-i18n="createButton"></button>
            </div>
          </form>
          <!-- Shown instead of the form when Back leads here after the password exists -->
          <div id="setup-done" class="stack-sm" hidden>
            <p class="muted" data-i18n="onboardingPasswordDone"></p>
            <div class="actions">
              <button id="back-2-done" type="button" class="secondary" data-i18n="backButton"></button>
              <button id="next-2-done" type="button" data-i18n="nextButton"></button>
            </div>
          </div>
        </div>

        <div id="step-3" class="step" hidden>
          <h2 id="step-3-title" tabindex="-1" aria-describedby="ob-progress-sr" data-i18n="onboardingSitesTitle"></h2>
          <p class="muted" data-i18n="onboardingSitesHint"></p>
          <div id="ob-chips" class="chips" role="group" aria-labelledby="step-3-title"></div>
          <div class="field">
            <label for="ob-domain" data-i18n="onboardingCustomLabel"></label>
            <form id="ob-add-form" class="row" autocomplete="off" novalidate>
              <input
                id="ob-domain"
                type="text"
                inputmode="url"
                autocapitalize="off"
                spellcheck="false"
                aria-describedby="ob-preview ob-site-error"
                data-i18n-placeholder="addDomainPlaceholder"
              />
              <button id="ob-add" type="submit" class="secondary" data-i18n="addButton"></button>
            </form>
          </div>
          <p id="ob-preview" class="preview"></p>
          <p id="ob-site-error" class="message error" role="alert"></p>
          <div class="actions">
            <button id="back-3" type="button" class="secondary" data-i18n="backButton"></button>
            <button id="next-3" type="button"></button>
          </div>
        </div>

        <div id="step-4" class="step" hidden>
          <h2 id="step-4-title" tabindex="-1" aria-describedby="ob-progress-sr" data-i18n="idleTitle"></h2>
          <div class="field">
            <label for="ob-idle" data-i18n="idleMinutesLabel"></label>
            <input id="ob-idle" class="narrow" type="number" min="1" max="60" step="1" inputmode="numeric" />
          </div>
          <label class="switch" for="ob-screen-lock">
            <input id="ob-screen-lock" type="checkbox" role="switch" />
            <span data-i18n="screenLockLabel"></span>
          </label>
          <p id="ob-finish-error" class="message error" role="alert"></p>
          <div class="actions">
            <button id="back-4" type="button" class="secondary" data-i18n="backButton"></button>
            <button id="finish" type="button" data-i18n="finishButton"></button>
          </div>
        </div>

        <!-- Only after a reload mid-onboarding: a way out to the settings -->
        <button id="ob-skip-setup" type="button" class="linklike" data-i18n="onboardingSkipSetup" hidden></button>
      </section>

      <!-- Password set, locked: nothing but the unlock form -->
      <section id="view-locked" class="card" hidden>
        <!-- Only for #permission-lost; says nothing about which sites -->
        <section id="locked-notice" class="notice" aria-labelledby="locked-notice-title" hidden>
          <h2 id="locked-notice-title" data-i18n="permissionLostTitle"></h2>
          <p data-i18n="permissionLostLockedBody"></p>
        </section>
        <p id="unlock-hint" class="muted" data-i18n="settingsUnlockHint"></p>
        <form id="unlock-form" class="form" autocomplete="off">
          <label for="unlock-password" data-i18n="passwordLabel"></label>
          <input id="unlock-password" type="password" autocomplete="new-password" required />
          <p id="unlock-error" class="message error" role="alert"></p>
          <button id="unlock-submit" type="submit" data-i18n="unlockButton"></button>
        </form>
      </section>

      <!-- Unlocked: a menu (sidebar, or tab bar on a narrow screen) and one section at a time -->
      <div id="view-settings" class="settings" hidden>
        <nav id="menu" class="menu" data-i18n-aria="menuLabel">
          <a href="#sites" data-section="sites" data-i18n="menuSites"></a>
          <a href="#autolock" data-section="autolock" data-i18n="menuAutolock"></a>
          <a href="#security" data-section="security" data-i18n="menuSecurity"></a>
          <a href="#about" data-section="about" data-i18n="menuAbout"></a>
        </nav>

        <div class="panels">
          <p id="tip" class="tip" role="status"></p>

          <div id="panel-sites" class="stack" data-panel="sites" hidden>
            <section id="permission-lost" class="notice" tabindex="-1" aria-labelledby="permission-lost-title" hidden>
              <h2 id="permission-lost-title" data-i18n="permissionLostTitle"></h2>
              <p data-i18n="permissionLostBody"></p>
              <button id="grant" type="button" data-i18n="grantButton"></button>
            </section>

            <section class="card" aria-labelledby="domains-title">
              <h2 id="domains-title" tabindex="-1" data-i18n="domainsTitle"></h2>
              <p class="muted" data-i18n="domainsHint"></p>
              <form id="add-form" class="row" autocomplete="off" novalidate>
                <input
                  id="domain"
                  type="text"
                  inputmode="url"
                  autocapitalize="off"
                  spellcheck="false"
                  aria-labelledby="domains-title"
                  aria-describedby="domain-preview domain-error"
                  data-i18n-placeholder="addDomainPlaceholder"
                />
                <button id="add" type="submit" data-i18n="addButton"></button>
              </form>
              <p id="domain-preview" class="preview"></p>
              <p id="domain-error" class="message error" role="alert"></p>
              <ul id="domains" class="domains"></ul>
              <p id="empty" class="muted" data-i18n="emptyDomains" hidden></p>
              <div id="related" class="chips"></div>
            </section>
          </div>

          <div id="panel-autolock" class="stack" data-panel="autolock" hidden>
            <section class="card" aria-labelledby="idle-title">
              <h2 id="idle-title" tabindex="-1" data-i18n="idleTitle"></h2>
              <div class="field">
                <label for="idle" data-i18n="idleMinutesLabel"></label>
                <input id="idle" class="narrow" type="number" min="1" max="60" step="1" inputmode="numeric" />
              </div>
              <label class="switch" for="screen-lock">
                <input id="screen-lock" type="checkbox" role="switch" />
                <span data-i18n="screenLockLabel"></span>
              </label>
            </section>
          </div>

          <div id="panel-security" class="stack" data-panel="security" hidden>
            <section class="card" aria-labelledby="change-title">
              <h2 id="change-title" tabindex="-1" data-i18n="changePasswordTitle"></h2>
              <form id="change-form" class="form" autocomplete="off">
                <label for="current" data-i18n="currentPasswordLabel"></label>
                <input id="current" type="password" autocomplete="new-password" required />
                <label for="next" class="spaced" data-i18n="newPasswordLabel"></label>
                <input id="next" type="password" autocomplete="new-password" required />
                <label for="change-confirm" class="spaced" data-i18n="confirmPasswordLabel"></label>
                <input id="change-confirm" type="password" autocomplete="new-password" required />
                <p id="change-error" class="message error" role="alert"></p>
                <button id="change-submit" type="submit" data-i18n="saveButton"></button>
              </form>
            </section>

            <section id="guard-row" class="card" aria-labelledby="guard-title" hidden>
              <h2 id="guard-title" tabindex="-1" data-i18n="guardTitle"></h2>
              <label class="switch" for="guard">
                <input id="guard" type="checkbox" role="switch" aria-describedby="guard-hint" />
                <span data-i18n="guardLabel"></span>
              </label>
              <p id="guard-hint" class="muted hint">
                <span data-i18n="guardHint"></span>
                <a id="guard-more" target="_blank" rel="noopener noreferrer" data-i18n="guardHintLink"></a>
              </p>
            </section>

            <section class="card" aria-labelledby="scope-title">
              <h2 id="scope-title" tabindex="-1" data-i18n="unlockScopeTitle"></h2>
              <div class="stack-sm" role="radiogroup" aria-labelledby="scope-title">
                <label class="radio" for="scope-all">
                  <input id="scope-all" name="unlock-scope" type="radio" value="all" />
                  <span data-i18n="unlockScopeAll"></span>
                </label>
                <label class="radio" for="scope-site">
                  <input id="scope-site" name="unlock-scope" type="radio" value="site" />
                  <span data-i18n="unlockScopeSite"></span>
                </label>
              </div>
            </section>
          </div>

          <div id="panel-about" class="stack" data-panel="about" hidden>
            <section class="card" aria-labelledby="about-title">
              <h2 id="about-title" tabindex="-1" data-i18n="menuAbout"></h2>
              <p id="about-version" class="muted"></p>
              <ul class="links">
                <li><a id="link-limits" target="_blank" rel="noopener noreferrer" data-i18n="aboutLimits"></a></li>
                <li><a id="link-privacy" target="_blank" rel="noopener noreferrer" data-i18n="aboutPrivacy"></a></li>
                <li><a id="link-repo" target="_blank" rel="noopener noreferrer" data-i18n="aboutRepo"></a></li>
              </ul>
            </section>
          </div>
        </div>
      </div>
    </main>
    <p id="toast" class="toast" role="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
